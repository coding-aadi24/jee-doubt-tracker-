<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgOrangeIcon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1C1917"/>
      <stop offset="100%" stop-color="#292524"/>
    </linearGradient>
    <linearGradient id="orangeGradIcon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B00"/>
      <stop offset="100%" stop-color="#FFA800"/>
    </linearGradient>
    <filter id="glowOrangeIcon" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bgOrangeIcon)" stroke="#EA580C" stroke-width="4"/>

  <g transform="translate(136, 126)">
    <path d="M 60 160 C 20 160 10 120 40 100 C 20 60 70 30 110 50 C 140 20 190 40 190 80 C 220 90 220 140 180 160 Z" fill="none" stroke="url(#orangeGradIcon)" stroke-width="6" stroke-dasharray="8 6" opacity="0.6"/>

    <polygon points="120,40 200,80 120,120 40,80" fill="url(#orangeGradIcon)" filter="url(#glowOrangeIcon)"/>
    <polygon points="120,55 180,80 120,105 60,80" fill="#1C1917" opacity="0.85"/>

    <path d="M 75 100 L 75 135 C 75 155 165 155 165 135 L 165 100" fill="none" stroke="url(#orangeGradIcon)" stroke-width="12" stroke-linecap="round"/>
    
    <path d="M 180 80 L 205 120 L 205 145" fill="none" stroke="#EF4444" stroke-width="6" stroke-linecap="round"/>
    <circle cx="205" cy="155" r="14" fill="#EF4444" filter="url(#glowOrangeIcon)"/>
    <text x="205" y="160" font-family="sans-serif" font-weight="900" font-size="14" fill="#FFFFFF" text-anchor="middle">?</text>

    <circle cx="40" cy="80" r="10" fill="#FF6B00" stroke="#FFFFFF" stroke-width="2"/>
    <circle cx="120" cy="40" r="10" fill="#FFA800" stroke="#FFFFFF" stroke-width="2"/>
    <circle cx="200" cy="80" r="10" fill="#F43F5E" stroke="#FFFFFF" stroke-width="2"/>
  </g>
</svg>