    <circle cx="120" cy="40" r="8" fill="#FFB800" stroke="#FFFFFF" stroke-width="2"/>
    <circle cx="200" cy="80" r="8" fill="#F43F5E" stroke="#FFFFFF" stroke-width="2"/>
