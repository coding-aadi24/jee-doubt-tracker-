    <polygon points="120,55 180,80 120,105 60,80" fill="#1C1917" opacity="0.85"/>

    <path d="M 75 100 L 75 135 C 75 155 165 155 165 135 L 165 100" fill="none" stroke="url(#orangeGradF)" stroke-width="10" stroke-linecap="round"/>
    
    <path d="M 180 80 L 205 120 L 205 145" fill="none" stroke="#EF4444" stroke-width="5" stroke-linecap="round"/>
    <circle cx="205" cy="155" r="12" fill="#EF4444" filter="url(#glowOrangeF)"/>
    <text x="205" y="160" font-family="sans-serif" font-weight="900" font-size="12" fill="#FFFFFF" text-anchor="middle">?</text>

